# HAR-RV Realized Volatility Forecaster — master config
# All parameters live here. Do not hard-code values in source files.

random_seed: 42

data:
  ticker: "SPY"
  start_date: "2004-01-01"       # target 10+ years; actual data may start later
  end_date:   "2024-12-31"
  bar_size: 5                     # intraday bar size in minutes
  data_source: "polygon"          # "polygon" | "fallback_daily"
  polygon_api_key_env: "POLYGON_API_KEY"   # env-var name holding the key
  raw_dir: "data/raw"
  snapshot_file: "spy_5min.parquet"
  daily_snapshot_file: "spy_daily.parquet"

rv:
  estimator: "yang_zhang"         # "intraday" | "yang_zhang"
  annualize: true
  trading_days_per_year: 252
  min_bars_per_day: 30            # days with fewer bars are flagged/dropped

har:
  horizon: 22                     # h-day-ahead forecast horizon (trading days)
  lags:
    daily:   1
    weekly:  5
    monthly: 22
  fit_log_har: true               # also fit HAR in log(RV) space
  log_bias_correction: true       # Jensen's inequality correction on back-transform
  hac_lags: null                  # null => auto-set to max(h, floor(T^(1/3)))

walk_forward:
  min_train_days: 504             # ~2 years minimum training window
  refit_every_days: 21            # refit roughly monthly
  embargo_days: 22                # purge overlap equal to forecast horizon
  benchmarks:
    - random_walk
    - rolling_historical_vol
    - vix
  rolling_vol_window: 22
  vix_ticker: "VIX"
  vix_snapshot_file: "vix_daily.parquet"

transaction_costs:                # Phase 4 only
  option_bid_ask_vega: 0.02       # $/vega round-trip
  slippage_bps: 5
  financing_rate_annual: 0.05

# Phase A — convex (true short-gamma) P&L model.
# Replaces the vega-linear proxy with a Black-Scholes short ATM straddle that is
# repriced along the realized price/vol path so losses grow ~quadratically with
# move size. Everything here is config-driven and reproducible.
convex_pnl:
  position_type: "straddle"       # ATM straddle = canonical short-vol position
  hold_days: 22                   # hold each straddle this many trading days (== horizon)
  tenor_buffer_days: 2            # option tenor = hold_days + buffer; close with buffer days
                                  # left so we never mark a τ→0 gamma singularity
  iv_mark: "vix"                  # "vix": mark implied vol to VIX_t daily (live vega P&L)
                                  #        "entry": freeze IV at entry (no vega P&L)
  ladder_daily: false             # false: ONE straddle, rolled at horizon & re-struck on
                                  # signal flips (how vol is actually traded; isolates the
                                  # effect of convexity from turnover). true: open one unit
                                  # each active day (overlapping ladder) — a turnover stress test.
  vega_notional: 1.0              # per-straddle sizing: P&L units per 1.00 change in vol
  risk_free_rate: 0.0             # BS r; 0 keeps the delta hedge free of spurious carry
  dividend_yield: 0.0             # SPY prices are total-return adjusted → q handled, keep 0
  # --- realistic, convex-aware costs ---
  option_bid_ask_vol: 0.01        # round-trip option spread in IMPLIED-VOL points (1 pt=0.01)
  stress_spread_mult: 3.0         # bid-ask widens ×this when VIX_t > stress_vix_level
  stress_vix_level: 30.0          # fixed (no-look-ahead) VIX cutoff for stressed spreads
  underlying_slippage_bps: 1.0    # slippage on delta-hedge share trades (bps of notional)
  hedge_cost: true                # charge the cost of delta hedging

# Phase C — the benchmark that matters: "sell vol when VIX is elevated".
# Both the baseline (on VIX) and the HAR-VRP signal (on VRP) use these ROLLING,
# point-in-time percentile thresholds, so neither gets a full-sample look-ahead edge.
baseline:
  signal_window: 756              # rolling lookback for the percentile (~3 trading years)
  signal_min_periods: 252         # require >=1y of history before a signal can fire
  short_percentile: 75            # short vol when the variable > its rolling Nth pct
  long_percentile: 25             # (symmetric HAR-VRP only) long vol when < this pct

# Signal-validation study — adversarial OOS test of four live signals through the harness.
# Each signal has a STRICT never-seen holdout; thresholds are PRIORS, not tuned to holdout.
signals:
  holdout_fdr: 0.05               # Benjamini-Hochberg FDR across the four signals
  spread:                         # Signal 1 — USO/BNO (WTI-Brent) beta-adjusted z-score
    uso_file: "uso_daily.parquet"
    bno_file: "bno_daily.parquet"
    holdout_start: "2023-01-01"   # dev 2010-06..2022-12 (contaminated); OOS 2023-01..2025-05
    beta_window: 252              # 1y rolling cointegration hedge ratio (point-in-time)
    z_window: 60                  # ~3-month rolling z-score window
    z_entry: 2.0                  # enter at |z|>2  (standard pairs-trade prior)
    z_exit: 0.5                   # exit at |z|<0.5 (reverted toward the mean)
    one_way_bps: 5.0              # one-way ETF cost per leg (bps) — conservative for BNO illiquidity
    ou_window: 252                # rolling OU half-life / ADF cointegration diagnostics
